spring.application.name=sistemaestoquemercado

# Lê o `.env` (mantido no .gitignore) quando rodar localmente a partir de `backend/`.
# No deploy (docker/Render) o arquivo não existe e esta linha é ignorada.
spring.config.import=optional:file:../.env

# Conexão PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=${PORT:10000}
server.address=0.0.0.0